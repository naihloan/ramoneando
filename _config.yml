collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title
  books:
    output: true
    # permalink: /books/:path/
    permalink: /books/:slug/

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed # Good to have for RSS

header_pages:
  - pages/index.markdown
  - pages/now.md
  - pages/about.md
  - pages/cv.md
#  - pages/books.md
#  - pages/portfolio.md
#  - pages/ai.md
#  - pages/AGENTS.md

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
exclude:
  - archive/
  - archived_folder/
  - old_stuff/
  - manual_backups/
