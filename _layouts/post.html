---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
    <div class="post-tags">
  {% for tag in page.tags %}
    <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}" class="tag-badge">
      #{{ tag }}
    </a>
  {% endfor %}
</div>
  {% endif %}
</article>
