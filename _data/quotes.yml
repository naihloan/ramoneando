- text: "We play not to avoid losing but to find out what we are capable of."
  author: "Jane McGonigal"
  category: "Systems"
- text: "Happiness does not consist in pastimes and amusements but in virtuous activities."
  author: "Aristotle"
  category: "Virtue"
- text: "Without deviation from the norm, progress is not possible."
  author: "Frank Zappa"
  category: "Creativity"
- text: "I used to think anyone doing anything weird was weird. Now I know that it is the people that call others weird that are weird."
  author: "Paul McCartney"
  category: "Creativity"
- text: "I believe in everything until it's disproved. So I believe in fairies, the myths, dragons. It all exists, even if it's in your mind. Who's to say that dreams and nightmares aren't as real as the here and now?"
  author: "John Lennon"
  category: "Imagination"
- text: "Both John and Paul were living up to Arthur Schopenhauer’s definition of genius: unlike talent, which hits a target nobody else can reach, genius hits a target nobody else can see."
  author: "Ian Leslie"
  category: "Art"
- text: "Control the narrative, instead of giving the content away to some soulless corporation."
  author: "Josh Sherman"
  category: "Independence"
- text: "Don't be pushed around by the fears in your mind. Be led by the dreams in your heart."
  author: "Roy T. Bennett"
  category: "Soul"
- text: "To fall in love with the world isn’t to ignore or overlook suffering, both human or otherwise. For me anyway, to fall in love with the world is to look up at the night sky and feel your mind swim before the beauty and the distance of the stars. It is to hold your children while they cry and watch the sycamore trees leaf out in June. When my breastbone starts to hurt, and my throat tightens and tears well in my eyes, I want to look away from feeling. I want to deflect with irony or anything else that will keep me from feeling directly. We all know how loving ends. But I want to fall in love with the world anyway, to let it crack me open. I want to feel what there is to feel while I am here."
  author: "John Green"
  category: "Metta"
- text: "The story so far: In the beginning the Universe was created. This has made a lot of people very angry and been widely regarded as a bad move."
  author: "Douglas Adams"
  category: "Creation"
- text: "The mind is its own place, and in itself can make a heaven of hell, a hell of heaven."
  author: "John Milton"
  category: "Worldview"
- text: "There is nothing to writing. All you do is sit down at a typewriter and bleed."
  author: "Ernest Hemingway"
  category: "Art"
- text: "Outside of a dog, a book is man's best friend. Inside of a dog it's too dark to read."
  author: "Groucho Marx"
  category: "Reading"
- text: "Things that are in heaven are more real than things that are in the world."
  author: "Emanuel Swedenborg"
  category: "Reality"
- text: "All you need is love. But a little chocolate now and then doesn't hurt."
  author: "Charles M. Schulz"
  category: "Love"
- text: "Prayer is not asking. It is a longing of the soul. It is daily admission of one's weakness. It is better in prayer to have a heart without words than words without a heart."
  author: "Mahatma Gandhi"
  category: "Soul"