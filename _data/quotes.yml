- text: "We play not to avoid losing but to find out what we are capable of."
  author: "Jane McGonigal"
  category: "Systems"
- text: "Control the narrative, instead of giving the content away to some soulless corporation."
  author: "Josh Sherman"
  category: "Independence"
- text: "Happiness does not consist in pastimes and amusements but in virtuous activities."
  author: "Aristotle"
  category: "Virtue"
- text: "I used to think anyone doing anything weird was weird. Now I know that it is the people that call others weird that are weird."
  author: "Paul McCartney"
  category: "Creativity"
- text: "Without deviation from the norm, progress is not possible."
  author: "Frank Zappa"
  category: "Creativity"
